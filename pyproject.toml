[project]
name = "on-air-indicator"
version = "0.1.0"
description = "Toggle smart home devices when your Mac's camera activates"
requires-python = ">=3.12"
dependencies = [
    "python-kasa",
    "tinytuya",
]

[project.scripts]
on-air-indicator = "on_air_indicator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]

[dependency-groups]
dev = [
    "ruff",
]
